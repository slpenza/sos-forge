# What sos.stevenpenza.com publishes. `sos site` reads this (design/v0/v0.2.0.md, v0.3.0.md).
#
# Datasets are built on a workstation (they take minutes and live data), bundled with `sos bundle <slug>`, and
# attached by hand to a data release (tag data-YYYY-MM, which deploys nothing) before the version tag that lists
# them is pushed. The site build downloads those zips, so CI never re-renders a dataset.
#
# lengths = [N, ...] offers a movie at other lengths too: each is built with `sos build <slug> --seconds N`, bundled
# as <slug>_<N>s_<size>.zip beside the standard zips, and picked on the gallery card. `sos site` checks every
# download and length is on its release (design/v0/v0.4.0.md). sources links each card's "Data:" line to where the
# data comes from; the full credits travel in every dataset's README and playlist.

[site]
domain = "sos.stevenpenza.com"
repo = "slpenza/sos-forge"
ask_base = "https://yik2mveql9.execute-api.us-east-1.amazonaws.com"   # Ask & Answer's API: the help, the ask box and the CSP use it
ask_projects = ["sos"]
preview_width = 2048             # browser previews are H.264 at this width (or smaller sources as they are)


# The help pages' frame. package.json's askAnswer block carries only what the corpus needs; the title, bar, groups,
# layout and the panel's words are added to a temporary copy of the project that the pinned corpus.py builds the pages
# from (design/v0/v0.3.0.md). The Ask & Answer release is pinned in ask.lock.json at the repo root, and fetched from
# $SOSFORGE_ASK_BASE at build time (design/v0/v0.4.2.md).
[help]
bar = "./site/help-bar.html"
title = { site = "SOS Forge", section = "Help" }
layout = "desk"                  # the question box first, recent and common questions, then the topics, one column
ask = { heading = "Ask about sos-forge", lede = "Answers come from these pages and quote the lines they rely on.", suggestions = 5 }

[[help.groups]]
name = "Getting started"
topics = ["docs/getting-started.md", "docs/simulator.md", "docs/deploying.md"]

[[help.groups]]
name = "Making datasets"
topics = ["docs/recipe-reference.md", "docs/video-formats.md"]

[[help.groups]]
name = "Data and credits"
topics = ["docs/data-sources.md"]

[[help.groups]]
name = "When something goes wrong"
topics = ["docs/troubleshooting.md"]

[[datasets]]
slug = "where_the_world_plays"
lengths = [18, 72, 135]
label_style = true
sources = [{ label = "OpenStreetMap contributors", url = "https://www.openstreetmap.org/copyright" }]
per = { unit = "sport", count = 9 }   # its pace: 8 sports and the all-sports map; dated movies take years from the recipe
dates = "Mapped as of 22 Nov 2026"     # when its OpenStreetMap data was fetched; every pace was rendered from that copy
release = "data-2026-11"
preview = "where_the_world_plays_4k_h264.zip"    # the zip whose video plays in browsers (H.264)
downloads = ["where_the_world_plays_4k.zip", "where_the_world_plays_4k_h264.zip"]

[[datasets]]
slug = "getting_richer"
lengths = [20, 101, 202]
label_style = true
sources = [{ label = "Maddison Project Database 2023", url = "https://www.rug.nl/ggdc/historicaldevelopment/maddison/releases/maddison-project-database-2023" }, { label = "Our World in Data", url = "https://ourworldindata.org/grapher/gdp-per-capita-maddison-project-database" }]
release = "data-2026-11"
preview = "getting_richer_4k_h264.zip"
downloads = ["getting_richer_4k.zip", "getting_richer_4k_h264.zip"]

[[datasets]]
slug = "cities_growing"
lengths = [11, 55, 110]
label_style = true
sources = [{ label = "GHSL Urban Centre Database R2024A, European Commission JRC", url = "https://doi.org/10.2905/1a338be6-7eaf-480c-9664-3a8ade88cbcd" }]
release = "data-2026-11"
preview = "cities_growing_4k_h264.zip"
downloads = ["cities_growing_4k.zip", "cities_growing_4k_h264.zip"]

[[datasets]]
slug = "tonight_aurora"
sources = [{ label = "NOAA Space Weather Prediction Center, OVATION", url = "https://www.swpc.noaa.gov/products/aurora-30-minute-forecast" }]
release = "data-2026-11"
preview = "tonight_aurora_4k.zip"                # a still image, so one zip serves both
downloads = ["tonight_aurora_4k.zip"]
dates = "23 Nov 2026, 02:06 UTC"               # the forecast time of this build; movies take theirs from the recipe
