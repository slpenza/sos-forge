# What sos.stevenpenza.com publishes. `sos site` reads this (design/v0/v0.2.0.md, v0.3.0.md).
#
# Datasets are built on a workstation (they take minutes and live data), bundled with `sos bundle <slug>`, and
# attached by hand to a data release (tag data-YYYY-MM, which deploys nothing) before the version tag that lists
# them is pushed. The site build downloads those zips, so CI never re-renders a dataset.

[site]
domain = "sos.stevenpenza.com"
repo = "slpenza/sos-forge"
ask_release = "v0.18.1"          # ask-answer tag whose client/ and tools/ the build copies; keep equal to ask-answer-deploy's "release"
ask_projects = ["sos"]
preview_width = 2048             # browser previews are H.264 at this width (or smaller sources as they are)

[[datasets]]
slug = "where_the_world_plays"
release = "data-2026-11"
preview = "where_the_world_plays_4k_h264.zip"    # the zip whose video plays in browsers (H.264)
downloads = ["where_the_world_plays_4k.zip", "where_the_world_plays_4k_h264.zip"]

[[datasets]]
slug = "getting_richer"
release = "data-2026-11"
preview = "getting_richer_4k_h264.zip"
downloads = ["getting_richer_4k.zip", "getting_richer_4k_h264.zip"]

[[datasets]]
slug = "cities_growing"
release = "data-2026-11"
preview = "cities_growing_4k_h264.zip"
downloads = ["cities_growing_4k.zip", "cities_growing_4k_h264.zip"]

[[datasets]]
slug = "tonight_aurora"
release = "data-2026-11"
preview = "tonight_aurora_4k.zip"                # a still image, so one zip serves both
downloads = ["tonight_aurora_4k.zip"]
