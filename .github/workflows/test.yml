# Test: every push to main and every pull request runs the suites. It deploys nothing; only a pushed v* tag
# releases (release.yml).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  # The site in headless Google Chrome (design/v0/v0.4.1.md): a fixture build served with CloudFront's CSP.
  # Google Chrome, not Playwright's Chromium, because the previews are H.264.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[dev,browser]" && python -m playwright install --with-deps chrome
      - name: Headless Chrome
        env:
          SOSFORGE_BROWSER_TESTS: '1'
        run: python -m pytest -q tests/test_browser.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Simulator logic
        run: node --test site/js/*.test.mjs
      - name: Site stack synth
        working-directory: infra
        run: npm ci && npm test
