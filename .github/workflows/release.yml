# Release: a pushed vX.Y.Z tag publishes that commit, and nothing else does; a commit to main publishes nothing
# (design/v0/v0.1.0.md and v0.2.0.md, following stevenpenza.com design/v0/v0.5.0.md).
#
# It runs tools/release.sh, the same script a release by hand runs. That script refuses a dirty tree, an untagged
# HEAD, a tag without its scope doc and a tag that disagrees with pyproject.toml. It then tests, builds, creates
# the GitHub Release, builds sos.stevenpenza.com and deploys it with CDK. The job runs in the `production`
# environment, which admits only v* tags, and AWS trusts only that environment (sosforge-deploy-role).
#
# This repo is public, so its workflows read no plain variables (stevenpenza.com's secrets standard, v0.7.19;
# tests/test_workflows.py): GitHub prints every step's environment in the logs and masks only secrets. A public value
# is written here; anything else is a secret (design/v0/v0.7.4.md, v0.8.1.md). The production environment holds:
#   secrets.AWS_DEPLOY_ROLE_ARN sosforge-deploy-role's ARN (the account stack's sosforgeDeployRoleArn output), a secret
#                             because it names the AWS account
#   secrets.SOS_STATUS_BUCKET stevenpenza.com's private dashboard bucket, where the stack publishes status/sos.json
#                             (design/v0/v0.7.0.md); its name stays out of the public repo and its logs
#   secrets.SOS_SUGGEST_TEST  optional: a test address Suggest a dataset may send to instead of sos@stevenpenza.com,
#                             chosen by the sos admin page's switch (design/v0/v0.7.2.md); out of the repo and logs
#   secrets.ASK_UPLOAD_KEY    a repository secret, sos's Ask & Answer upload key: each release uploads the help docs
#                             it committed (design/v0/v0.4.10.md). The build fetches the release ask.lock.json pins
#                             from site/site.toml's ask_base and checks every file against the lock (design/v0/v0.4.2.md).
name: release

on:
  push:
    tags: ['v*']

# One release at a time, never cancelled mid-flight: a half-uploaded site is worse than a late one.
concurrency:
  group: production
  cancel-in-progress: false

# contents: write creates the GitHub Release (the stevenpenza.com template is read-only because it deploys only
# to AWS). id-token: write is OIDC, for AWS and for optional PyPI trusted publishing.
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      PYPI_PUBLISH: ${{ secrets.PYPI_PUBLISH }}
    defaults:
      run:
        working-directory: sos-forge
    steps:
      - uses: actions/checkout@v4
        with:
          path: sos-forge
          fetch-depth: 0
          fetch-tags: true

      # Before anything is built: a tag that scopes nothing never publishes.
      - name: The tag is a scoped version
        run: python3 tools/scope.py --release "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sos-forge/infra/package-lock.json
      - name: Install
        run: python -m pip install -e ".[dev]" build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: sosforge-release-${{ github.run_id }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASK_UPLOAD_KEY: ${{ secrets.ASK_UPLOAD_KEY }}
          SOSFORGE_SUGGEST_TEST: ${{ secrets.SOS_SUGGEST_TEST }}
          SOSFORGE_STATUS_BUCKET: ${{ secrets.SOS_STATUS_BUCKET }}
        run: ./tools/release.sh

      # The deployed site in headless Google Chrome: every page loads clean under its real CSP, and every download on
      # every card answers (tools/smoke.py, design/v0/v0.4.1.md). A failure here means the deploy needs a look.
      - name: Smoke check
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chrome
          python tools/smoke.py "https://$(python3 -c 'import tomllib; print(tomllib.load(open("site/site.toml","rb"))["site"]["domain"])')"

      # Off until PyPI has a trusted publisher for this repo + environment and the secret PYPI_PUBLISH is set to
      # true, read through the job's env because a step's `if` can't read secrets. OIDC means no stored token.
      - name: PyPI
        if: env.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sos-forge/dist-pkg/
