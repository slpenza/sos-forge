# Release: a pushed vX.Y.Z tag publishes that commit, and nothing else does; a commit to main publishes nothing
# (design/v0/v0.1.0.md and v0.2.0.md, following stevenpenza.com design/v0/v0.5.0.md).
#
# It runs tools/release.sh, the same script a release by hand runs. That script refuses a dirty tree, an untagged
# HEAD, a tag without its scope doc and a tag that disagrees with pyproject.toml. It then tests, builds, creates
# the GitHub Release, builds sos.stevenpenza.com and deploys it with CDK. The job runs in the `production`
# environment, which admits only v* tags, and AWS trusts only that environment (sosforge-deploy-role).
#
# The production environment holds:
#   vars.AWS_DEPLOY_ROLE_ARN  sosforge-deploy-role's ARN (the account stack's sosforgeDeployRoleArn output)
#   vars.ASK_API_BASE         the Ask & Answer API base written into the site's config.json
#   vars.SOS_ZONE_ID          optional: the stevenpenza.com zone ID, which skips a lookup
#   secrets.ASK_ANSWER_KEY    read-only deploy key for slpenza/ask-answer (panel files and corpus.py)
name: release

on:
  push:
    tags: ['v*']

# One release at a time, never cancelled mid-flight: a half-uploaded site is worse than a late one.
concurrency:
  group: production
  cancel-in-progress: false

# contents: write creates the GitHub Release (the stevenpenza.com template is read-only because it deploys only
# to AWS). id-token: write is OIDC, for AWS and for optional PyPI trusted publishing.
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sos-forge
    steps:
      - uses: actions/checkout@v4
        with:
          path: sos-forge
          fetch-depth: 0
          fetch-tags: true

      # Before anything is built: a tag that scopes nothing never publishes.
      - name: The tag is a scoped version
        run: python3 tools/scope.py --release "$GITHUB_REF_NAME"

      - name: Pinned ask-answer release
        id: ask
        run: echo "tag=$(python3 -c 'import tomllib; print(tomllib.load(open("site/site.toml","rb"))["site"]["ask_release"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: slpenza/ask-answer
          ref: ${{ steps.ask.outputs.tag }}
          ssh-key: ${{ secrets.ASK_ANSWER_KEY }}
          path: ask-answer
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sos-forge/infra/package-lock.json
      - name: Install
        run: python -m pip install -e ".[dev]" build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: sosforge-release-${{ github.run_id }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOSFORGE_ASK_BASE: ${{ vars.ASK_API_BASE }}
          SOSFORGE_ASK_ANSWER: ../ask-answer
          SOS_ZONE_ID: ${{ vars.SOS_ZONE_ID }}
        run: ./tools/release.sh

      # Off until PyPI has a trusted publisher for this repo + environment and the repo variable
      # PYPI_PUBLISH is set to true. OIDC means no stored token.
      - name: PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sos-forge/dist-pkg/
