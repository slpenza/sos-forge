# Release: a pushed vX.Y.Z tag publishes that commit, and nothing else does; a commit to main publishes nothing
# (design/v0/v0.1.0.md and v0.2.0.md, following stevenpenza.com design/v0/v0.5.0.md).
#
# It runs tools/release.sh, the same script a release by hand runs. That script refuses a dirty tree, an untagged
# HEAD, a tag without its scope doc and a tag that disagrees with pyproject.toml. It then tests, builds and creates
# the GitHub Release. The job runs in the `production` environment, which admits only v* tags.
#
# It deploys nothing and signs in to nothing. sos.stevenpenza.com is deployed by its own private repo, sos-site, from a
# pinned sos-forge tag (design/v0/v0.9.0.md).
#
# This repo is public, so its workflows read no plain variables (stevenpenza.com's secrets standard, v0.7.19;
# tests/test_workflows.py): GitHub prints every step's environment in the logs and masks only secrets. The one secret
# is PYPI_PUBLISH, below.
name: release

on:
  push:
    tags: ['v*']

# One release at a time, never cancelled mid-flight.
concurrency:
  group: production
  cancel-in-progress: false

# contents: write creates the GitHub Release. id-token: write is OIDC, for optional PyPI trusted publishing.
permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PYPI_PUBLISH: ${{ secrets.PYPI_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Before anything is built: a tag that scopes nothing never publishes.
      - name: The tag is a scoped version
        run: python3 tools/scope.py --release "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: python -m pip install -e ".[dev]" build

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release.sh

      # Off until PyPI has a trusted publisher for this repo + environment and the secret PYPI_PUBLISH is set to
      # true, read through the job's env because a step's `if` can't read secrets. OIDC means no stored token.
      - name: PyPI
        if: env.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pkg/
